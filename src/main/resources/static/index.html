<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuDucDung</title>
    <style>
      :root {
        --bg: #f6f2ea;
        --ink: #1b1b1b;
        --accent: #d16a4a;
        --muted: #6b6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Serif", "Georgia", serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 15% 10%, #fff7ea 0%, var(--bg) 45%, #efe6d8 100%);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(860px, 92vw);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid #e6dac8;
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 44px);
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.6;
      }
      .row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .pill {
        padding: 8px 14px;
        background: #fff1e6;
        border: 1px solid #f0d2bf;
        border-radius: 999px;
        font-size: 14px;
        color: #7a3b27;
      }
      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Xin chào từ CuDucDung</h1>
      <p>Trang index này được tạo sẵn để bạn chạy thử ứng dụng và kiểm tra Docker.</p>
      <div class="row">
        <div class="pill">Spring Boot</div>
        <div class="pill">Java 21</div>
        <div class="pill">Docker Ready</div>
      </div>
      <a class="cta" href="#">Bắt đầu</a>
    </div>
  </body>
</html>
